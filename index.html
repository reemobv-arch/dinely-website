<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinely</title>
<meta name="description" content="Dinely is het platform waar restaurants en creators elkaar vinden. Kies of je een restaurant of een content creator bent.">
<style>
  :root{
    --bg:#0E0C0A;
    --text:#F3EEE4; --muted:#CBBFAE;
    --gold:#C9A24B; --gold-2:#E4C67E; --gold-dim:#8C7231;
    --ff-display:"Didot","Bodoni 72","Bodoni MT","Hoefler Text",Garamond,"Times New Roman",serif;
    --ff-body:-apple-system,"Helvetica Neue","Segoe UI",Roboto,system-ui,Arial,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--text);font-family:var(--ff-body);
    -webkit-font-smoothing:antialiased;line-height:1.5;
    height:100dvh;overflow:hidden;position:relative;
  }
  ::selection{background:rgba(201,162,75,.28);color:#fff}
  a{color:inherit;text-decoration:none}
  h1{margin:0;font-weight:400}
  p{margin:0}

  /* logo, midden bovenin */
  .brand{
    position:absolute;top:26px;left:50%;transform:translateX(-50%);
    z-index:10;font-family:var(--ff-display);font-size:30px;letter-spacing:.02em;
    text-shadow:0 2px 24px rgba(0,0,0,.7);pointer-events:none;
  }
  .brand b{color:var(--gold);font-weight:400}
  .brand .dot{color:var(--gold)}

  /* twee panelen */
  .split{display:flex;height:100dvh}
  .panel{
    position:relative;flex:1 1 50%;min-width:0;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    text-align:center;padding:0 30px 9vh;transition:flex-basis .5s ease;
  }
  .panel .bg{
    position:absolute;inset:0;background-size:cover;background-position:center;
    filter:brightness(.7) saturate(1.06);transition:transform .9s ease,filter .5s ease;
  }
  .panel.restaurant .bg{background-image:url("assets/restaurant.jpg")}
  .panel.creator .bg{background-image:url("assets/creator.jpg")}
  .panel::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(8,6,4,.30) 0%, rgba(8,6,4,.34) 42%, rgba(8,6,4,.74) 100%);
  }
  .panel:hover .bg{transform:scale(1.05);filter:brightness(.82) saturate(1.12)}

  /* dunne gouden scheiding */
  .panel.restaurant::before{
    content:"";position:absolute;top:0;bottom:0;right:0;width:1px;z-index:3;
    background:linear-gradient(180deg, transparent, rgba(201,162,75,.35), transparent);
  }

  .inner{position:relative;z-index:4;max-width:360px;display:flex;flex-direction:column;align-items:center}
  .eyebrow{
    font-family:var(--ff-mono,var(--ff-body));font-size:12px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--gold-2);margin-bottom:12px;
  }
  .role{font-family:var(--ff-display);font-size:clamp(34px,4.6vw,58px);line-height:1.02;color:#fff}
  .desc{color:var(--muted);font-size:15px;line-height:1.55;margin:16px 0 26px;max-width:300px}

  .cta{
    display:inline-flex;align-items:center;gap:11px;
    font-family:var(--ff-mono,var(--ff-body));font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;
    padding:15px 28px;border-radius:100px;
    background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#20180A;
    box-shadow:0 12px 30px -10px rgba(201,162,75,.6);transition:.22s;
  }
  .panel:hover .cta{transform:translateY(-2px);box-shadow:0 16px 36px -10px rgba(201,162,75,.7)}
  .cta .arw{transition:.22s}
  .panel:hover .cta .arw{transform:translateX(4px)}

  /* mobiel: onder elkaar */
  @media (max-width:760px){
    .split{flex-direction:column}
    .panel{padding:0 24px 6vh;justify-content:flex-end}
    .panel:first-child{padding-top:84px;justify-content:center}
    .panel.restaurant::before{top:auto;bottom:0;right:0;left:0;width:auto;height:1px;
      background:linear-gradient(90deg, transparent, rgba(201,162,75,.35), transparent)}
    .role{font-size:38px}
  }
</style>
</head>
<body>
  <div class="brand">Dine<b>ly</b><span class="dot">.</span></div>

  <main class="split">
    <a class="panel restaurant" href="https://business.dinely.nl" aria-label="Ik ben een restaurant, naar het dashboard">
      <div class="bg"></div>
      <div class="inner">
        <span class="eyebrow">Ik ben een</span>
        <h1 class="role">Restaurant</h1>
        <p class="desc">Zet deals uit en laat creators je tafels vullen.</p>
        <span class="cta">Naar het dashboard <span class="arw">&rarr;</span></span>
      </div>
    </a>

    <a class="panel creator" href="https://app.dinely.nl" aria-label="Ik ben een content creator, naar de app">
      <div class="bg"></div>
      <div class="inner">
        <span class="eyebrow">Ik ben een</span>
        <h1 class="role">Content creator</h1>
        <p class="desc">Verdien met deals bij restaurants en maak content.</p>
        <span class="cta">Naar de app <span class="arw">&rarr;</span></span>
      </div>
    </a>
  </main>
</body>
</html>
